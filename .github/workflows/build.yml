name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: write

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: wisweep

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install pnpm via npm
        run: npm install -g pnpm@9

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript check
        run: pnpm tsc --noEmit

      - name: Install Rust stable
        run: |
          rustup update stable
          rustc --version
          cargo --version

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows x64 ──
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

          # ── macOS x64 + arm64 (universal) ──
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg

          # ── Linux x64 ──
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb appimage

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: wisweep

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install pnpm via npm
        run: npm install -g pnpm@9

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Install Rust stable with target
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}
          rustc --version
          cargo --version

      # ── Windows 依赖 ──
      - name: Install Windows Build Tools
        if: runner.os == 'Windows'
        run: |
          choco install visualstudio2022buildtools -y --no-progress --params "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.Windows10SDK.19041"
          choco install webview2-runtime -y --no-progress
        shell: powershell

      # ── Linux 依赖 ──
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ── macOS universal: 同时加 x86_64 目标 ──
      - name: Add macOS x86_64 target (universal)
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      # ── 构建 & 发布 ──
      - name: Build & Release Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_HTTP_TIMEOUT: 600
          RUST_LOG: debug
        with:
          projectPath: wisweep
          appName: Wisweep
          tagName: ${{ github.ref_name }}
          releaseName: '智净大师 v__VERSION__'
          releaseBody: '请查看 [RELEASE_NOTES.md](https://github.com/${{ github.repository }}/blob/main/RELEASE_NOTES.md) 了解本版本的变更。'
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}
